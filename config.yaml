project:
  task_name: concrete_compressive_strength_prediction

paths:
  data_dir: data
  outputs_dir: outputs
  dataset_filename: concrete_data.csv

task:
  target_column: compressive_strength
  input_columns:
    - cement
    - slag
    - fly_ash
    - water
    - superplasticizer
    - coarse_aggregate
    - fine_aggregate
    - age

data:
  mode: local_file
  fallback_to_synthetic_on_error: true
  real_data_sources:
    - https://archive.ics.uci.edu/static/public/165/concrete+compressive+strength.zip
    - https://archive.ics.uci.edu/ml/machine-learning-databases/concrete/compressive/Concrete_Data.xls
  local_file:
    path: concrete_combined.xlsx
    sheet_name: Combined
    drop_columns:
      - source
    column_mapping:
      blast_furnace_slag: slag
      concrete_compressive_strength: compressive_strength
    unit_conversions:
      fly_ash_g_per_L:
        rename: fly_ash
        multiplier: 1.0
  synthetic_rows: 1030
  test_size: 0.2
  stratify_bins: 5
  outlier_detection:
    enabled: true
    contamination: 0.03

data_split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

metrics:
  primary_metric: rmse
  direction: minimize
  composite_weights:
    rmse: 0.5
    r2: 0.3
    mae: 0.2

engineering_bounds:
  min: 0.0
  max: 120.0

validator:
  context_type: general
  suspicious_water_cement_ratio: 0.7
  suspicious_strength_mpa: 30.0
  durability_water_cement_warn: 0.6
  scm_meaningful_replacement_threshold: 0.15
  high_volume_scm_replacement_threshold: 0.45
  age_regime_early_max_days: 7.0
  age_regime_later_min_days: 56.0
  durability_water_cement_limits:
    general: 0.60
    structural: 0.50
    exposed: 0.45
    severe: 0.45
    marine: 0.40
    freeze_thaw: 0.45
    sulfate: 0.45
  durability_effective_binder_limits:
    general: 0.60
    structural: 0.50
    exposed: 0.45
    severe: 0.45
    marine: 0.40
    freeze_thaw: 0.45
    sulfate: 0.45
  # Keep very high w/c + high strength as a hard reject only when the
  # binder context also looks implausible for early-age concrete.
  high_water_cement_strength_hard_fail_max_age_days: 28.0
  high_water_cement_strength_low_scm_threshold: 0.20
  high_water_cement_strength_unfavorable_water_binder_ratio: 0.50
  low_water_binder_warn: 0.25
  workability_support_superplasticizer_ratio: 0.01
  total_binder_low_warn: 250.0
  total_binder_high_warn: 550.0
  paste_rich_aggregate_paste_ratio_threshold: 2.85
  shrinkage_low_water_binder_threshold: 0.38
  shrinkage_strength_threshold: 50.0
  scm_durability_preferred_water_binder_ratio: 0.45
  low_target_strength_upper_bound_mpa: 35.0
  low_target_cement_factor_warn: 9.0
  low_target_cement_minimum_warn: 320.0
  fly_ash_replacement_warn: 0.4
  slag_replacement_warn: 0.7
  early_age_days_warn: 3.0
  early_age_strength_warn: 30.0
  superplasticizer_assumed_unit: kg_per_m3
  superplasticizer_unit_confidence: moderate
  superplasticizer_dosage_warn_kg_per_m3: 18.0
  superplasticizer_binder_ratio_warn: 0.05

engineering:
  feature_engineering: true
  uncertainty_method: conformal  # options: conformal, quantile, both
  regime_modeling:
    enabled: true
    transition_width_mpa: 2.0
  binder_efficiency:
    # Semi-empirical defaults for this repository. These are configurable and
    # should be treated as dataset-calibrated priors, not universal constants.
    fly_ash_k: 0.35
    slag_k: 0.80
  design_tool:
    default_age_days: 28
    target_tolerance_mpa: 2.0
    cost_proxy: cement_content
    top_ranked_candidates: 5
    reference_mix:
      water_cement_ratio: 0.5
    search:
      initial_samples: 3000
      refinement_rounds: 2
      top_candidates: 40
      local_samples_per_candidate: 24
      local_scale: 0.12
      reference_grid_points: 120
    constraints:
      cement:
        min: 100.0
        max: 600.0
      slag:
        min: 0.0
        max: 350.0
      fly_ash:
        min: 0.0
        max: 200.0
      water:
        min: 120.0
        max: 230.0
      superplasticizer:
        min: 0.0
        max: 32.0
      coarse_aggregate:
        min: 800.0
        max: 1200.0
      fine_aggregate:
        min: 500.0
        max: 950.0
      age:
        fixed: 28.0
      water_cement_ratio:
        max: 0.6
      fly_ash_replacement_ratio:
        max: 0.35
      slag_replacement_ratio:
        max: 0.65

uncertainty:
  calibration_fraction: 0.28
  coverage_level: 0.92
  reliability_bins: 10
  strength_bins_mpa: [0.0, 20.0, 35.0, 50.0]
  lower_alpha: 0.05
  median_alpha: 0.5
  upper_alpha: 0.95
  tight_threshold_mpa: 5.0
  wide_threshold_mpa: 10.0
  quantile_model:
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 10
    subsample: 0.9
    colsample_bytree: 0.9

experiment:
  optuna_trials: 30
  cv_folds: 5
  cv_repeats: 1
  random_seed: 42

benchmark:
  trials_per_model: 30
  cv_folds: 5
  cv_repeats: 1
  reference_result_path: outputs/best_search_result.json
  reference_uncertainty_path: outputs/uncertainty_calibration.json
  uncertainty_method: conformal
  models:
    LinearRegression:
      enabled: true
      display_name: LinearRegression
      tune: false
      search_space: {}
    Ridge:
      enabled: true
      display_name: Ridge
      search_space:
        alpha:
          type: float
          low: 0.0001
          high: 100.0
          log: true
        fit_intercept:
          type: categorical
          choices: [true, false]
        solver:
          type: categorical
          choices: [auto, svd, cholesky, lsqr]
    ElasticNet:
      enabled: true
      display_name: ElasticNet
      search_space:
        alpha:
          type: float
          low: 0.0001
          high: 10.0
          log: true
        l1_ratio:
          type: float
          low: 0.05
          high: 0.95
        fit_intercept:
          type: categorical
          choices: [true, false]
    SVR:
      enabled: true
      display_name: SVR
      search_space:
        C:
          type: float
          low: 0.1
          high: 1000.0
          log: true
        epsilon:
          type: float
          low: 0.001
          high: 1.0
          log: true
        gamma:
          type: float
          low: 0.0001
          high: 1.0
          log: true
    KNeighborsRegressor:
      enabled: true
      display_name: KNN
      search_space:
        n_neighbors:
          type: int
          low: 3
          high: 31
          step: 2
        weights:
          type: categorical
          choices: [uniform, distance]
        p:
          type: categorical
          choices: [1, 2]
    RandomForestRegressor:
      enabled: true
      display_name: RandomForest
      search_space:
        n_estimators:
          type: int
          low: 200
          high: 800
          step: 100
        max_depth:
          type: categorical
          choices: [null, 6, 10, 14, 18]
        min_samples_split:
          type: int
          low: 2
          high: 12
        min_samples_leaf:
          type: int
          low: 1
          high: 5
        max_features:
          type: categorical
          choices: [sqrt, log2, 0.5, 1.0]
    ExtraTreesRegressor:
      enabled: true
      display_name: ExtraTrees
      search_space:
        n_estimators:
          type: int
          low: 200
          high: 800
          step: 100
        max_depth:
          type: categorical
          choices: [null, 6, 10, 14, 18]
        min_samples_split:
          type: int
          low: 2
          high: 12
        min_samples_leaf:
          type: int
          low: 1
          high: 5
        max_features:
          type: categorical
          choices: [sqrt, log2, 0.5, 1.0]
    GradientBoostingRegressor:
      enabled: true
      display_name: GradientBoosting
      search_space:
        n_estimators:
          type: int
          low: 100
          high: 600
          step: 50
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        max_depth:
          type: int
          low: 2
          high: 5
        min_samples_split:
          type: int
          low: 2
          high: 12
        min_samples_leaf:
          type: int
          low: 1
          high: 10
        subsample:
          type: float
          low: 0.6
          high: 1.0
    HistGradientBoostingRegressor:
      enabled: true
      display_name: HistGradientBoosting
      search_space:
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        max_depth:
          type: categorical
          choices: [null, 3, 5, 7]
        max_leaf_nodes:
          type: int
          low: 15
          high: 63
        min_samples_leaf:
          type: int
          low: 5
          high: 30
        l2_regularization:
          type: float
          low: 0.0001
          high: 1.0
          log: true
    XGBRegressor:
      enabled: true
      display_name: XGBoost
      search_space:
        n_estimators:
          type: int
          low: 200
          high: 800
          step: 100
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        max_depth:
          type: int
          low: 3
          high: 10
        min_child_weight:
          type: float
          low: 1.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 1.0
        colsample_bytree:
          type: float
          low: 0.6
          high: 1.0
        reg_alpha:
          type: float
          low: 0.000001
          high: 1.0
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
    LGBMRegressor:
      enabled: true
      display_name: LightGBM
      search_space:
        n_estimators:
          type: int
          low: 200
          high: 800
          step: 100
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        num_leaves:
          type: int
          low: 15
          high: 127
        min_child_samples:
          type: int
          low: 5
          high: 40
        subsample:
          type: float
          low: 0.6
          high: 1.0
        colsample_bytree:
          type: float
          low: 0.6
          high: 1.0
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
    CatBoostRegressor:
      enabled: true
      display_name: CatBoost
      search_space:
        iterations:
          type: int
          low: 200
          high: 800
          step: 100
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        depth:
          type: int
          low: 4
          high: 10
        l2_leaf_reg:
          type: float
          low: 1.0
          high: 10.0
        bagging_temperature:
          type: float
          low: 0.0
          high: 5.0
        random_strength:
          type: float
          low: 0.0
          high: 2.0

baseline_model:
  model_name: RandomForestRegressor
  params:
    n_estimators: 300
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: sqrt
    n_jobs: -1

research:
  brief_path: research_brief.md
  editable_surface_path: research_lab.py
  memory_filename: experiment_memory.json
  max_cycles: 10
  max_runtime_minutes: 0
  max_trial_seconds: 0
  scout_candidates_per_cycle: 8
  confirm_top_k: 2
  scout_cv_repeats: 1
  confirm_cv_repeats: 3
  max_family_repeats_per_cycle: 1
  exploit_delta_ratio: 0.15
  rebuild_reports_on_keep: true

llm:
  enabled: true
  backend_mode: ollama
  allow_deterministic_fallback: true
  default_local_proposal_model: qwen3-coder:480b-cloud
  default_openai_model: gpt-4o
  qwen_thinking_mode: false
  ollama_base_url: http://localhost:11434
  temperature: 0.3
  num_predict: 2048
  request_timeout_seconds: 600
  compact_prompt_models: [qwen3:4b]
  enable_regeneration_on_reject: true
  max_regeneration_attempts: 1
  duplicate_similarity_thresholds:
    numeric_tolerance: 0.05
    float_round_digits: 4
  temporarily_block_saturated_families: true
  diversity:
    max_family_share: 0.35
  admission_policy:
    policy_name: backend_admission
    version: 1
    warning_band_fraction: 0.8
    thresholds:
      min_success_rate: 0.9
      max_backend_failure_rate: 0.1
      max_parse_failure_rate: 0.1
      max_schema_failure_rate: 0.1
      max_semantic_failure_rate: 0.1
      max_hidden_channel_incidence: 0.05
      max_empty_visible_response_incidence: 0.1
      max_p95_latency_seconds: 5.0
  interval_trials: 15
  interaction_interval_minutes: 5
  smart_model_after_progress: 0.67
  include_no_think_directive: true
  log_interactions: true
  interaction_log_filename: llm_interactions.jsonl
  ollama:
    base_url: http://localhost:11434
    model: qwen3-coder:480b-cloud
    fast_model: qwen3-coder:480b-cloud
    smart_model: qwen3-coder:480b-cloud
    options:
      num_ctx: 2048
      num_gpu: 1
    timeout_seconds: 600
    use_cli_fallback: true
  openai:
    base_url: https://api.openai.com/v1/responses
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 120
  hybrid:
    primary: ollama
    fallback: openai
  tasks:
    proposal_count: 8
    summary_enabled: true

search:
  progress_interval: 10
  build_ensemble_after_search: true
  research_brief_path: research_brief.md
  # Soft per-trial runtime budget. 0 disables budget checks.
  max_trial_seconds: 0
  llm_proposals:
    enabled: false
    interval_trials: 15
    interaction_interval_minutes: 5
    smart_model_after_progress: 0.67
    fast_model: "qwen3-coder:480b-cloud"
    smart_model: "qwen3-coder:480b-cloud"
    ollama_base_url: "http://localhost:11434"
    include_no_think_directive: false
    log_interactions: true
    interaction_log_filename: "llm_interactions.jsonl"
  # Search keeps running until it satisfies both this runtime floor and
  # experiment.optuna_trials.
  min_runtime_minutes: 50
  models:
    RandomForestRegressor:
      enabled: true
      display_name: RandomForest
      search_space:
        n_estimators:
          type: int
          low: 100
          high: 600
          step: 50
        max_depth:
          type: categorical
          choices: [null, 4, 6, 8, 10, 14, 18]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 1
          high: 4
        max_features:
          type: categorical
          choices: [sqrt, log2, null]
    ExtraTreesRegressor:
      enabled: true
      display_name: ExtraTrees
      search_space:
        n_estimators:
          type: int
          low: 200
          high: 800
          step: 100
        max_depth:
          type: categorical
          choices: [null, 6, 10, 14, 18]
        min_samples_split:
          type: int
          low: 2
          high: 12
        min_samples_leaf:
          type: int
          low: 1
          high: 5
        max_features:
          type: categorical
          choices: [sqrt, log2, 0.5, 1.0]
    GradientBoostingRegressor:
      enabled: false
      display_name: GradientBoosting
      search_space:
        n_estimators:
          type: int
          low: 100
          high: 500
          step: 50
        learning_rate:
          type: float
          low: 0.01
          high: 0.3
          log: true
        max_depth:
          type: int
          low: 2
          high: 6
        min_samples_split:
          type: int
          low: 2
          high: 12
        min_samples_leaf:
          type: int
          low: 1
          high: 6
        subsample:
          type: float
          low: 0.6
          high: 1.0
    HistGradientBoostingRegressor:
      enabled: true
      display_name: HistGradientBoosting
      search_space:
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        max_depth:
          type: categorical
          choices: [null, 3, 5, 7]
        max_leaf_nodes:
          type: int
          low: 15
          high: 63
        min_samples_leaf:
          type: int
          low: 5
          high: 30
        l2_regularization:
          type: float
          low: 0.0001
          high: 1.0
          log: true
    XGBRegressor:
      enabled: true
      display_name: XGBoost
      search_space:
        n_estimators:
          type: int
          low: 100
          high: 500
          step: 50
        learning_rate:
          type: float
          low: 0.01
          high: 0.3
          log: true
        max_depth:
          type: int
          low: 3
          high: 10
        min_child_weight:
          type: float
          low: 1.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 1.0
        colsample_bytree:
          type: float
          low: 0.6
          high: 1.0
        reg_alpha:
          type: float
          low: 0.000001
          high: 10.0
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
    LGBMRegressor:
      enabled: true
      display_name: LightGBM
      search_space:
        n_estimators:
          type: int
          low: 100
          high: 500
          step: 50
        learning_rate:
          type: float
          low: 0.01
          high: 0.3
          log: true
        num_leaves:
          type: int
          low: 15
          high: 63
        min_child_samples:
          type: int
          low: 5
          high: 30
        subsample:
          type: float
          low: 0.6
          high: 1.0
        colsample_bytree:
          type: float
          low: 0.6
          high: 1.0
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
    CatBoostRegressor:
      enabled: true
      display_name: CatBoost
      search_space:
        iterations:
          type: int
          low: 200
          high: 800
          step: 100
        learning_rate:
          type: float
          low: 0.01
          high: 0.2
          log: true
        depth:
          type: int
          low: 4
          high: 10
        l2_leaf_reg:
          type: float
          low: 1.0
          high: 10.0
        bagging_temperature:
          type: float
          low: 0.0
          high: 5.0
        random_strength:
          type: float
          low: 0.0
          high: 2.0
    SVR:
      enabled: false
      display_name: SVR
      search_space:
        C:
          type: float
          low: 0.1
          high: 100.0
          log: true
        epsilon:
          type: float
          low: 0.001
          high: 1.0
          log: true
        kernel:
          type: categorical
          choices: [rbf, poly, sigmoid]
        gamma:
          type: categorical
          choices: [scale, auto]
    Ridge:
      enabled: false
      display_name: Ridge
      search_space:
        alpha:
          type: float
          low: 0.001
          high: 100.0
          log: true
        fit_intercept:
          type: categorical
          choices: [true, false]
        solver:
          type: categorical
          choices: [auto, svd, cholesky, lsqr]
